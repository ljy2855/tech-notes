<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스위치의 프레임 전달</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Imported from Mermaid · doc-inline · balanced</p>
    <h1>스위치의 프레임 전달</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l2-frame-forwarding-title l2-frame-forwarding-desc">
        <title id="l2-frame-forwarding-title">스위치의 프레임 전달</title>
        <desc id="l2-frame-forwarding-desc">스위치가 수신한 프레임의 src MAC을 학습한 뒤 dst MAC이 MAC table에 있으면 해당 port로만 전달하고, 없거나 broadcast면 같은 VLAN의 다른 port로 flood하는 흐름.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ CONNECTORS (before nodes) ============ -->
        <!-- 프레임 수신 -> src MAC 학습 -->
        <line x1="192" y1="200" x2="256" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- src MAC 학습 -> dst MAC 판단 -->
        <line x1="432" y1="200" x2="496" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 판단 -> 해당 port로만 전달 (있음) -->
        <line x1="656" y1="200" x2="752" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 판단 -> flood (없음 / broadcast) -->
        <line x1="576" y1="260" x2="576" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ============ CONNECTOR LABELS (Korean register: 12px sans 500) ============ -->
        <rect x="688" y="176" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="704" y="188" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">있음</text>

        <rect x="584" y="300" width="116" height="16" rx="2" fill="#f5f5f5"/>
        <text x="642" y="312" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">없음 / broadcast</text>

        <!-- ============ NODES ============ -->
        <!-- Start: 프레임 수신 (oval) -->
        <rect x="48" y="172" width="144" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="48" y="172" width="144" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="120" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">프레임 수신</text>
        <text x="120" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">port 1</text>

        <!-- Step: src MAC 학습 -->
        <rect x="256" y="172" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="172" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="344" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">src MAC 학습</text>
        <text x="344" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">(src MAC, port 1)</text>

        <!-- Decision (focal): dst MAC table에 있나? -->
        <polygon points="576,140 656,200 576,260 496,200" fill="#f5f5f5"/>
        <polygon points="576,140 656,200 576,260 496,200" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="576" y="195" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">dst MAC</text>
        <text x="576" y="213" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">table에 있나?</text>

        <!-- End: 해당 port로만 전달 (oval) -->
        <rect x="752" y="176" width="160" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="752" y="176" width="160" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="832" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">해당 port로만 전달</text>

        <!-- End: 같은 VLAN의 다른 port로 flood (oval) -->
        <rect x="464" y="356" width="224" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="464" y="356" width="224" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="576" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">같은 VLAN의 다른 port로 flood</text>

        <!-- ============ LEGEND ============ -->
        <line x1="48" y1="508" x2="912" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="48" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="128" y="526" width="28" height="14" rx="7" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="164" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">START / END</text>

        <rect x="272" y="526" width="20" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">STEP</text>

        <polygon points="368,524 378,533 368,542 358,533" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="388" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">DECISION · FOCAL</text>
      </svg>
    </div>
  </div>
</body>
</html>
