<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLAN access와 trunk</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Imported from Mermaid · doc-inline · balanced</p>
    <h1>VLAN access와 trunk</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l2-vlan-title l2-vlan-desc">
        <title id="l2-vlan-title">VLAN access와 trunk</title>
        <desc id="l2-vlan-desc">Web Server는 VLAN 10, DB Server는 VLAN 20 access port로 ToR Switch에 붙고, VM마다 다른 VLAN을 쓰는 Hypervisor와 상위 스위치는 VLAN 10,20을 함께 싣는 trunk로 연결된다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <!-- Trunk arrowhead: user-space units so the 2px stroke does not double the head -->
          <marker id="arrow-trunk" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2d3142"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ CONNECTORS (before nodes) ============ -->
        <!-- Web Server -> ToR : access VLAN 10 -->
        <line x1="240" y1="168" x2="448" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- DB Server -> ToR : access VLAN 20 -->
        <line x1="240" y1="256" x2="448" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Hypervisor -> ToR : trunk VLAN 10,20 -->
        <line x1="240" y1="348" x2="448" y2="348" stroke="#2d3142" stroke-width="2" marker-end="url(#arrow-trunk)"/>
        <!-- ToR -> 상위 스위치 : trunk VLAN 10,20 -->
        <line x1="608" y1="260" x2="752" y2="260" stroke="#2d3142" stroke-width="2" marker-end="url(#arrow-trunk)"/>

        <!-- ============ CONNECTOR LABELS ============ -->
        <rect x="296" y="148" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="344" y="157" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ACCESS · VLAN 10</text>

        <rect x="296" y="236" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="344" y="245" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ACCESS · VLAN 20</text>

        <rect x="288" y="328" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="344" y="337" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TRUNK · VLAN 10,20</text>

        <rect x="624" y="240" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="249" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TRUNK · VLAN 10,20</text>

        <!-- ============ NODES ============ -->
        <!-- Web Server -->
        <rect x="64" y="140" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="140" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="88" y="157" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="152" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">Web Server</text>

        <!-- DB Server -->
        <rect x="64" y="228" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="228" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="236" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="88" y="245" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="152" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">DB Server</text>

        <!-- Hypervisor -->
        <rect x="64" y="316" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="316" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="324" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="88" y="333" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="152" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">Hypervisor</text>
        <text x="152" y="366" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">VM마다 다른 VLAN</text>

        <!-- ToR Switch (focal) -->
        <rect x="448" y="144" width="160" height="228" rx="6" fill="#f5f5f5"/>
        <rect x="448" y="144" width="160" height="228" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="456" y="152" width="24" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="468" y="161" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SW</text>
        <text x="528" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">ToR Switch</text>

        <!-- 상위 스위치 -->
        <rect x="752" y="232" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="752" y="232" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="760" y="240" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="772" y="249" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SW</text>
        <text x="832" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">상위 스위치</text>

        <!-- ============ LEGEND ============ -->
        <line x1="64" y1="508" x2="912" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="64" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="144" y1="533" x2="172" y2="533" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="180" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">ACCESS · 1 VLAN</text>

        <line x1="304" y1="533" x2="332" y2="533" stroke="#2d3142" stroke-width="2" marker-end="url(#arrow-trunk)"/>
        <text x="340" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">TRUNK · N VLAN</text>

        <rect x="460" y="526" width="20" height="14" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="488" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">FOCAL</text>

        <rect x="556" y="526" width="20" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="584" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">HOST</text>

        <rect x="644" y="526" width="20" height="14" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="672" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">UPSTREAM</text>
      </svg>
    </div>
  </div>
</body>
</html>
