<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARP로 MAC 찾기</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Imported from Mermaid · doc-inline · balanced</p>
    <h1>ARP로 MAC 찾기</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l2-arp-title l2-arp-desc">
        <title id="l2-arp-title">ARP로 MAC 찾기</title>
        <desc id="l2-arp-desc">Server A가 10.0.0.2의 MAC을 broadcast ARP Request로 묻고, 스위치가 이를 flood하면 Server B가 unicast ARP Reply로 bb:bb:bb를 알려주며, A는 이를 ARP cache에 저장한 뒤 그 MAC으로 프레임을 보낸다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ LIFELINES (x = 160, 480, 800) ============ -->
        <line x1="160" y1="128" x2="160" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="128" x2="480" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="128" x2="800" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ============ MESSAGES (time flows down) ============ -->
        <!-- M1: A -> Switch  ARP Request (broadcast) -->
        <line x1="160" y1="192" x2="480" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M2: Switch -> B  flood -->
        <line x1="480" y1="256" x2="800" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M3: B -> A  ARP Reply (unicast) — headline -->
        <line x1="800" y1="336" x2="160" y2="336" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- M4: A -> B  이후 dst MAC = bb:bb:bb 로 전송 -->
        <line x1="160" y1="448" x2="800" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ============ MESSAGE LABELS ============ -->
        <!-- M1 label: mono line + Korean line -->
        <rect x="252" y="152" width="136" height="32" rx="2" fill="#f5f5f5"/>
        <text x="320" y="162" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ARP REQUEST (BROADCAST)</text>
        <text x="320" y="180" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">10.0.0.2 누구야?</text>

        <!-- M2 label -->
        <rect x="620" y="236" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FLOOD</text>

        <!-- M3 label (headline) -->
        <rect x="584" y="296" width="112" height="32" rx="2" fill="#f5f5f5"/>
        <text x="640" y="306" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ARP REPLY (UNICAST)</text>
        <text x="640" y="322" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10.0.0.2 = bb:bb:bb</text>

        <!-- M4 label (Korean register) -->
        <rect x="208" y="424" width="224" height="16" rx="2" fill="#f5f5f5"/>
        <text x="320" y="436" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">이후 dst MAC = bb:bb:bb 로 전송</text>

        <!-- ============ NOTE ON A: ARP cache에 저장 (store treatment) ============ -->
        <rect x="88" y="356" width="144" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="356" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="160" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">ARP cache에 저장</text>

        <!-- ============ ACTORS ============ -->
        <!-- Server A -->
        <rect x="80" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="72" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="88" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="104" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="160" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">Server A</text>
        <text x="160" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10.0.0.1</text>

        <!-- Switch -->
        <rect x="400" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="72" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="408" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="420" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SW</text>
        <text x="480" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">Switch</text>

        <!-- Server B -->
        <rect x="720" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="72" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="728" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="744" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">Server B</text>
        <text x="800" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10.0.0.2</text>

        <!-- ============ LEGEND ============ -->
        <line x1="80" y1="508" x2="880" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="80" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="160" y1="533" x2="188" y2="533" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="196" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">FRAME</text>

        <line x1="272" y1="533" x2="300" y2="533" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="308" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">ARP REPLY · HEADLINE</text>

        <rect x="452" y="526" width="20" height="14" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="480" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">LOCAL STATE</text>
      </svg>
    </div>
  </div>
</body>
</html>
